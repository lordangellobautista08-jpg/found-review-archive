<body>
<header><div class="w hi"><button class="btn" id="bg" onclick="dr(1)" aria-label="Menu">☰</button><a class="brand" onclick="go(ME ? 'dash' : 'home')">Found <i>/</i> CE Review Archive</a><div id="tb"></div></div></header>

<script>
/* ===== BASICS ===== */
/* These two values are public. Your data is protected by the database rules (RLS), not by hiding them. */
const SB_URL='https://ixwfnogcxcctkpnnlqaw.supabase.co',SB_KEY='sb_publishable_Kn0-quPSdHj7a8WwsJ8nmA_yXFJdf3N';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),v=id=>$('#'+id).value,U=()=>Math.random().toString(36).slice(2,8),C=['MSTC','HPGE','PSAD'],
E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sh=a=>[...a].sort(()=>Math.random()-.5),mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),
go=h=>{if(location.hash=='#/'+h)route();else location.hash='#/'+h},
CD={MSTC:'Mathematics, Surveying and Transportation Engineering.',HPGE:'Hydraulics and Geotechnical Engineering.',PSAD:'Structural Analysis and Design.'};
let D={FO:[],M:[],F:[],MQ:[],U:[]},P={h:[],q:{},fc:{},bm:[]},role='student',nv=0,tk,QL=0,OQ=[],ME=null,PR=null,CU=null,AU={mode:'in',msg:''};
let folderView='grid';
let fabOpen=false,fabMode='folder',fabComponent='',fabDestination='';
let activeMenu = null;
/* ===== CUSTOM CONFIRMATION MODAL STATE ===== */
let confirmModalState = null; // { title, message, onYes }

  // Native File Viewer State
let viewerFile = null; // { title, url, type }

async function openM(id) {
  const m = D.M.find(x => x.id == id);
  if (!m || !m.path) return toast('File not found');

  const r = await sb.storage.from('review-materials').createSignedUrl(m.path, 3600);
  if (r.error) return toast(r.error.message);

  const url = r.data.signedUrl;
  const ext = m.type.toLowerCase();

  // Open natively in-site if PDF or image, otherwise open in new tab
  if (['pdf', 'jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
    viewerFile = { title: m.title, url, type: ext };
    route();
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

function closeViewer() {
  viewerFile = null;
  route();
}

function renderFileViewer() {
  let root = $('#fileViewerRoot');
  if (!root) {
    const div = document.createElement('div');
    div.id = 'fileViewerRoot';
    document.body.appendChild(div);
    root = div;
  }
  if (!viewerFile) {
    root.innerHTML = '';
    return;
  }
  const isPdf = viewerFile.type === 'pdf';
  root.innerHTML = `
    <div class="fm-backdrop" onclick="closeViewer()" style="padding:20px;">
      <div class="fm-card" onclick="event.stopPropagation()" style="max-width:960px; width:100%; height:85vh; display:flex; flex-direction:column; padding:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bd); padding-bottom:10px; margin-bottom:10px;">
          <h2 style="font-size:1.1rem; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80%;">${E(viewerFile.title)}</h2>
          <button class="btn" onclick="closeViewer()">✕ Close</button>
        </div>
        <div style="flex:1; width:100%; height:100%; overflow:hidden; background:#f0f0f0; border-radius:var(--r); display:flex; align-items:center; justify-content:center;">
          ${isPdf 
            ? `<iframe src="${viewerFile.url}" style="width:100%; height:100%; border:none;"></iframe>`
            : `<img src="${viewerFile.url}" style="max-width:100%; max-height:100%; object-fit:contain;" alt="">`
          }
        </div>
      </div>
    </div>
  `;
}

function showConfirm(title, message, onYes) {
  confirmModalState = { title, message, onYes };
  route();
}

function closeConfirm() {
  confirmModalState = null;
  route();
}

function toggleMenu(id, event) {
  event.stopPropagation();
  activeMenu = activeMenu === id ? null : id;
  route();
}

document.addEventListener('click', () => {
  if (activeMenu) {
    activeMenu = null;
    route();
  }
});

function renameFolder(id) {
  const f = D.FO.find(x => x.id == id);
  if (!f) return;
  const newName = prompt('Enter new folder name:', f.name);
  if (!newName || !newName.trim()) return;
  sb.from('folders').update({ name: newName.trim() }).eq('id', id).then(r => {
    if (r.error) return toast(r.error.message);
    f.name = newName.trim();
    toast('Folder renamed');
    route();
  });
}

function toggleFolderView(){
  folderView=folderView==='grid'?'list':'grid';
  route();
}
function openFab(mode='folder'){
  fabMode=mode;
  fabOpen=true;

  const parts=location.hash.slice(2).split('/');
  const page=parts[0];
  const current=page==='f'?D.FO.find(x=>x.id==parts[1]):null;

  fabComponent=current?current.c:C.includes(parts[1])?parts[1]:'';
  fabDestination=current?current.id:'';

  renderFab();
}

function closeFab(){
  fabOpen=false;
  renderFab();
}

function fabFolders(){
  const list=D.FO.filter(f=>
    f.c===fabComponent &&
    (fabMode==='folder'||f.own||f.def||role==='admin')
  );

  return list.map(f=>`
    <option value="${f.id}" ${fabDestination===f.id?'selected':''}>
      ${f.def ? '📁 [Default] ' : '— '.repeat(folderDepth(f))}${E(f.name)}
    </option>
  `).join('');
}
function folderDepth(f){
  let depth=0,p=f.parent;
  while(p){
    const parent=D.FO.find(x=>x.id==p);
    if(!parent)break;
    depth++;
    p=parent.parent;
  }
  return depth;
}

function updateFabFolders(){
  fabDestination='';
  const el=$('#fabFolder');
  if(!el)return;

  el.innerHTML=fabFolders();
}

function renderFab(){
  const root=$('#fabRoot');
  if(!root)return;

  if(!ME){
    root.innerHTML='';
    return;
  }

  root.innerHTML=`
    <button class="fab" onclick="openFab()" aria-label="Create or upload">+</button>

    ${fabOpen?`
      <div class="fm-backdrop" onclick="closeFab()">
        <div class="fm-card" onclick="event.stopPropagation()">

          <div class="row" style="justify-content:space-between;margin:0 0 14px">
            <h2 style="margin:0">Create or upload</h2>
            <button class="btn" onclick="closeFab()">✕</button>
          </div>

          <div class="fm-modes">
            <button class="btn ${fabMode==='folder'?'p':''}" onclick="openFab('folder')">📁 New folder</button>
            <button class="btn ${fabMode==='upload'?'p':''}" onclick="openFab('upload')">↑ Upload files</button>
          </div>

          <div class="field">
            <label>Component</label>
            <select id="fabComponent" onchange="fabComponent=this.value;fabDestination='';updateFabFolders()">
              <option value="">Choose component</option>
              ${C.map(c=>`
                <option value="${c}" ${fabComponent===c?'selected':''}>${c}</option>
              `).join('')}
            </select>
          </div>

          <div class="field">
            <label>${fabMode==='folder'?'Parent folder':'Upload destination'}</label>
            <select id="fabFolder" onchange="fabDestination=this.value">
              <option value="">${fabMode==='folder'?'Component root':'Choose a folder'}</option>
              ${fabFolders()}
            </select>
          </div>

          ${fabMode==='folder'?`
            <div class="field">
              <label>Folder name</label>
              <input id="fabName" placeholder="Enter folder name">
            </div>
          `:`
            <div class="field">
              <label>Select files</label>
              <input id="fabFiles" type="file" multiple
                accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.webp"
                onchange="$('#fabFileCount').textContent=this.files.length+' file(s) selected'">
              <p id="fabFileCount" class="mu sm">You can select multiple files.</p>
            </div>
            <div class="field">
              <label>Description (optional, applies to all files)</label>
              <textarea id="fabDesc" placeholder="Add a description"></textarea>
            </div>
            <p class="mu sm">PDF, Word, PowerPoint, Excel or image. Maximum 25 MB per file. Each file will use its filename as its title.</p>
          `}

          <div class="fm-actions">
            <button class="btn" onclick="closeFab()">Cancel</button>
            <button class="btn p" onclick="${fabMode==='folder'?'createFabFolder()':'uploadFabFiles()'}">
              ${fabMode==='folder'?'Create folder':'Upload files'}
            </button>
          </div>
        </div>
      </div>
    `:''}
  `;
}

function renderCustomConfirm() {
  let root = $('#confirmModalRoot');
  if (!root) {
    const div = document.createElement('div');
    div.id = 'confirmModalRoot';
    document.body.appendChild(div);
    root = div;
  }
  if (!confirmModalState) {

  }
  root.innerHTML = `

      <div class="fm-card" onclick="event.stopPropagation()">
        <h2>${E(confirmModalState.title)}</h2>
        <p class="mu" style="margin-bottom:20px">${E(confirmModalState.message)}</p>

          <button class="btn p" onclick="confirmModalState.onYes(); closeConfirm();">Confirm</button>
        </div>
      </div>
    </div>
  `;
}
  
async function createFabFolder(){
  const name=$('#fabName').value.trim();

  if(!fabComponent)return toast('Choose a component first');
  if(!name)return toast('Enter a folder name');

  const parent=fabDestination||null;
  const parentFolder=parent?D.FO.find(x=>x.id==parent):null;

  if(parent&&!parentFolder)return toast('Parent folder not found');
  if(parentFolder&&parentFolder.c!==fabComponent)
    return toast('Choose a folder from the selected component');

  const owner=parentFolder?.own?ME.id:role==='admin'?null:ME.id;

  const result=await sb.from('folders').insert({
    component:fabComponent,
    name,
    parent_id:parent,
    owner_id:owner
  }).select().single();

  if(result.error)return toast(result.error.message);

  D.FO.push({
    id:result.data.id,
    c:fabComponent,
    name,
    parent,
    def:false,
    own:result.data.owner_id?1:0
  });

  fabOpen=false;
  toast('Folder created');
  route();
}
async function uploadFabFiles(){
  const fo=fabDestination;
  const files=[...($('#fabFiles')?.files||[])];
  const desc=$('#fabDesc').value.trim();

  if(!fabComponent)return toast('Choose a component first');
  if(!fo)return toast('Choose an upload destination');

  const folder=D.FO.find(x=>x.id==fo);
  if(!folder)return toast('Folder not found');

  if(!folder.own&&role!=='admin')
    return toast('You can only upload to your own folders');

  if(!files.length)return toast('Choose at least one file');

  const allowed=['pdf','doc','docx','ppt','pptx','xls','xlsx','jpg','jpeg','png','webp'];

  for(const file of files){
    const ext=file.name.split('.').pop().toLowerCase();

    if(file.size>25*1024*1024)
      return toast(file.name+' exceeds the 25 MB limit');

    if(!allowed.includes(ext))
      return toast(file.name+' has an unsupported file type');
  }

  const uploaded=[];
  const records=[];

  for(const [i,file] of files.entries()){
    const ext=file.name.split('.').pop().toLowerCase();

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');

    const upload=await sb.storage.from('review-materials').upload(path,file,{
      cacheControl:'3600',
      upsert:false
    });

    if(upload.error){
      if(uploaded.length)
        await sb.storage.from('review-materials').remove(uploaded);
      return toast(upload.error.message);
    }

    uploaded.push(path);

    records.push({
      folder_id:fo,
      title:file.name.replace(/\.[^.]+$/,''),
      description:desc,
      file_type:ext.toUpperCase(),
      file_path:path,
      published:folder.own?true:role==='admin',
      owner_id:folder.own?ME.id:null
    });
  }

  const result=await sb.from('materials').insert(records).select();

  if(result.error){
    await sb.storage.from('review-materials').remove(uploaded);
    return toast(result.error.message);
  }

  result.data.forEach(x=>{
    D.M.push({
      id:x.id,
      fo:x.folder_id,
      title:x.title,
      desc:x.description||'',
      type:x.file_type||'',
      path:x.file_path||'',
      pub:x.published,
      own:x.owner_id?1:0
    });
  });

  fabOpen=false;
  toast(files.length+' file(s) uploaded successfully');
  route();
}

async function impCsv(el){const f=el.files[0];if(!f)return;const rows=[];
csv((await f.text()).replace(/^\uFEFF/,'')).slice(1).filter(r=>r.length>=14).forEach(r=>{const x=r.length-14,g=i=>(r[i<9?i:i+x]||'').trim(),a=g(9).toUpperCase();/* rows with 2 extra columns are auto-repaired */
if(a.length!=1||!'ABCD'.includes(a))return;rows.push({question_number:+g(0)||null,component:g(1).toUpperCase(),subject:g(2),topic:g(3),question:g(4),choice_a:g(5),choice_b:g(6),choice_c:g(7),choice_d:g(8),correct_answer:a,explanation:g(10),difficulty:g(11),source:g(12),verification_status:g(13),owner_id:null})});
if(!rows.length)return toast('No valid rows found. Check the columns.');if(!confirm('Add '+rows.length+' official questions?'))return;
for(let i=0;i<rows.length;i+=100){const r=await sb.from('questions').insert(rows.slice(i,i+100));if(r.error)return toast(r.error.message)}
toast('Added '+rows.length+' questions');await load();route()}
const AD={
o:()=>`<div class="g">${[['Users',D.U.length],['Official questions',OQ.length],['Folders',D.FO.length],['Folder items',D.M.length],['Official flashcards',D.F.filter(x=>!x.own).length]].map(([n,x])=>`<div class="card art stat"><b>${x}</b><span class="mu sm">${n}</span></div>`).join('')}</div>`,
u:()=>`<table><tr><th>Name</th><th>Role</th><th>Joined</th></tr>${D.U.map(u=>`<tr><td>${E(u.display_name||'')}</td><td>${u.role}</td><td class="mu sm">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</table><p class="mu sm">To change someone's role, edit the profiles table in Supabase (Table Editor).</p>`,
f:()=>`<div class="card stack"><h3>New official card</h3>${fform({},0)}</div><table>${D.F.filter(x=>!x.own).map(x=>`<tr><td>${E(x.f)} ${x.img?'🖼':''}</td><td class="mu sm">${x.c}</td><td><a class="lk" onclick="pub('${x.id}')">${x.pub?'Published':'Hidden'}</a></td><td><a class="lk" onclick="del('F','${x.id}')">Delete</a></td></tr>`).join('')}</table>`,
q:()=>{const m={};OQ.forEach(x=>{const k=x.c+' › '+x.s+' › '+x.t;m[k]=(m[k]||0)+1});const fl=OQ.filter(x=>/need/i.test(x.st)).length;
return `<div class="card stack"><h3>Official questions: ${OQ.length}</h3><p class="mu sm">Add one below, or import a CSV with the same columns as before. New questions show up for everyone right away.</p><div><p class="lb">Import CSV</p><input type="file" accept=".csv" onchange="impCsv(this)"></div>${fl?`<p class="sm">${fl} question(s) are marked "Needs Review".</p>`:''}</div><h3 style="margin-top:18px">Add one official question</h3>${qform(1)}<table>${Object.entries(m).map(([k,n])=>`<tr><td>${E(k)}</td><td>${n}</td></tr>`).join('')}</table>`}};
V.admin=()=>hd('Admin Dashboard','Manage official content. Security is enforced by the database rules (RLS).')+`<div class="w sec"><div class="tabs">${[['o','Overview'],['u','Users'],['f','Official cards'],['q','Questions']].map(([k,n])=>`<a class="${AT==k?'on':''}" onclick="AT='${k}';route()">${n}</a>`).join('')}</div>${AD[AT]()}</div>`;

/* ===== MENU, TOP BAR, LOGIN, ROUTER ===== */
const drawer=()=>{const a=(h,t)=>`<a onclick="dr(0);${h}">${t}</a>`;return a("go('dash')",'Dashboard')+a("go('quiz')",'Quiz')+a("go('hist')",'Quiz History')+`<p class="dl">Components</p>`+C.map(c=>a(`go('c/${c}')`,c)).join('')+`<p class="dl">Study</p>`+a("FF={c:'',k:''};go('cards')",'Flashcards')+a("FF={c:'',k:'img'};go('cards')",'Formula Cards')+a("go('myq')",'My Questions')+(role=='admin'?`<p class="dl">Admin</p>`+a("go('admin')",'Admin Dashboard'):'')+`<p class="dl"></p>`+a("out()",'Log out')};
const tbar=()=>ME?`<span class="sm mu" style="white-space:nowrap">${E(PR&&PR.display_name||'')} <span class="tag">${role}</span></span>`:`<button class="btn" onclick="AU.mode='in';AU.msg='';go('auth')">Log in</button> <button class="btn p" onclick="AU.mode='up';AU.msg='';go('auth')">Sign up</button>`;
function out(){sb.auth.signOut()}
V.auth=()=>{const m=AU.mode,T={in:'Log in',up:'Create account',reset:'Reset password',newpw:'Set a new password'};
return hd(T[m],m=='newpw'?'Choose a new password for your account.':'Sign in to save your progress and keep it on every device.')+`<div class="w sec"><div class="card art stack" style="max-width:440px;margin:auto">${AU.msg?`<div class="exp">${E(AU.msg)}</div>`:''}${m=='up'?'<input id="an" placeholder="Display name" style="width:100%">':''}${m=='newpw'?'':'<input id="ae" type="email" placeholder="Email" autocomplete="email" style="width:100%">'}${m=='reset'?'':`<input id="ap" type="password" placeholder="${m=='newpw'?'New password':'Password'}" autocomplete="${m=='in'?'current-password':'new-password'}" style="width:100%">`}<button class="btn p" onclick="doAuth()">${T[m]}</button><p class="sm">${m=='in'?`<a class="lk" onclick="AU.mode='up';AU.msg='';route()">Create an account</a> · <a class="lk" onclick="AU.mode='reset';AU.msg='';route()">Forgot password?</a>`:m=='newpw'?'':`<a class="lk" onclick="AU.mode='in';AU.msg='';route()">Back to log in</a>`}</p></div></div>`};
async function doAuth(){const m=AU.mode,e=m=='newpw'?'':v('ae').trim(),p=m=='reset'?'':v('ap');let r;
if(m=='up'){if(p.length<6)return toast('Password needs at least 6 characters');r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:v('an').trim()||e.split('@')[0]}}})}
else if(m=='in')r=await sb.auth.signInWithPassword({email:e,password:p});
else if(m=='reset'){r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(!r.error){AU.msg='Check your email for the reset link.';return route()}}
else{r=await sb.auth.updateUser({password:p});if(!r.error){AU.mode='in';toast('Password updated');return go('dash')}}
if(r.error)return toast(r.error.message);
if(m=='up'&&!r.data.session){AU.msg='Account created. Check your email to confirm it, then log in.';route()}}
  
function route(){clearTimeout(tk);const[n0,a]=(location.hash.slice(2)||'home').split('/');let n=V[n0]?n0:'home';
if(!QL){$('#app').innerHTML='<div class="w sec">'+empty('Loading…')+'</div>';$('#tb').innerHTML='';$('#bg').style.display='none';return}
if(!ME&&!['home','auth'].includes(n))n='auth';
if(ME&&n=='auth'&&AU.mode!='newpw')n='dash';
if(n=='admin'&&role!='admin'){toast('Admins only');n='dash'}
const ap=$('#app');ap.innerHTML=V[n](a);if(nv){ap.className='';void ap.offsetWidth;ap.className='in';nv=0}
$('#tb').innerHTML=tbar();$('#dr').innerHTML=ME?drawer():'';$('#bg').style.display=ME?'':'none';
renderFab();
renderCustomConfirm();
renderFileViewer();
if(n=='quiz'&&QZ&&!QZ.done){cnt();if(QZ.end)tick()}else smry()}
addEventListener('hashchange',()=>{nv=1;scrollTo(0,0);route()});
addEventListener('keydown',e=>{if(e.key=='Enter'&&location.hash=='#/auth'&&e.target.tagName=='INPUT')doAuth()});
/* session: runs on page load, login, logout and password-reset links */
sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
if(ev=='PASSWORD_RECOVERY')AU.mode='newpw';
ME=s&&s.user||null;
if(!ME){CU=null;D={FO:[],M:[],F:[],MQ:[],U:[]};P={h:[],q:{},fc:{},bm:[]};OQ=[];PR=null;role='student';QZ=null;QL=1;if(ev=='SIGNED_OUT')go('home');else route();return}
if(ME.id!=CU){CU=ME.id;QL=0;route();await load();QL=1}
if(AU.mode=='newpw')go('auth');else if(location.hash=='#/auth')go('dash');else route()},0));
route();
</script>
</body>
