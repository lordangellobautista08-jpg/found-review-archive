<script>

const fpath=f=>{const p=[];let x=f;while(x){p.unshift(x.name);x=x.parent?D.FO.find(y=>y.id==x.parent):null}return p.join(' › ')};

const csv=tx=>{const R=[];let r=[],f='',q=0;for(let i=0;i<tx.length;i++){const c=tx[i];if(q){if(c=='"'){if(tx[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&tx[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R};
const dbq=x=>({id:x.id,c:x.component,s:x.subject,t:x.topic,q:x.question,o:[x.choice_a,x.choice_b,x.choice_c,x.choice_d],a:'ABCD'.indexOf(x.correct_answer),e:x.explanation||'',d:x.difficulty||'',st:x.verification_status||'',own:x.owner_id?1:0});
const allQ=()=>[...OQ,...D.MQ],subs=c=>[...new Set(allQ().filter(x=>x.c==c).map(x=>x.s))],tops=(c,s)=>[...new Set(allQ().filter(x=>x.c==c&&x.s==s).map(x=>x.t))];
const stat=f=>{const q=allQ().filter(f);let ok=0,n=0,m=0,at=0;q.forEach(x=>{const s=P.q[x.id];if(s){at++;ok+=s[0];n+=s[1];m+=s[2]}});return{n:q.length,at,acc:n?Math.round(100*ok/n):0,ms:q.length?Math.round(100*m/q.length):0}};
const bars=s=>`<div class="mrow" style="margin-top:12px"><div class="ring" style="--p:${s.ms}"><span>${s.ms}%</span></div><div><b>Mastery</b><small>Questions you last answered correctly</small></div></div><p class="sm" style="margin-top:14px">Accuracy ${s.acc}%</p><div class="pb"><b style="width:${s.acc}%"></b></div>`;
async function pg(t,f){let a=[],i=0;for(;;){const r=await f(sb.from(t).select('*')).range(i,i+999);if(r.error)return{data:a,error:r.error};a=a.concat(r.data);if(r.data.length<1000)return{data:a};i+=1000}}
async function load(){
  try {
    const r = await Promise.all([
      sb.from('profiles').select('*').eq('id', ME.id).maybeSingle(),
      pg('questions', q => q.order('id')),
      sb.from('folders').select('*').order('created_at'),
      sb.from('materials').select('*').order('created_at'),
      sb.from('flashcards').select('*').order('created_at'),
      sb.from('flashcard_marks').select('*'),
      sb.from('bookmarks').select('*'),
      pg('question_stats', q => q.order('question_id')),
      sb.from('quiz_attempts').select('*').order('created_at', { ascending: false }).limit(30)
    ]);

    const er = r.find(x => x && x.error);
    if (er) console.warn('Supabase warning:', er.error.message);

    const g = i => (r[i] && r[i].data) ? r[i].data : [];
    
    PR = (r[0] && r[0].data) ? r[0].data : { display_name: '', role: 'student' };
    role = PR.role || 'student';

    const Q = g(1).map(dbq);
    OQ = Q.filter(x => !x.own);
    D.MQ = Q.filter(x => x.own);

    D.FO = g(2).map(x => ({
      id: x.id,
      c: x.component,
      name: x.name,
      parent: x.parent_id || null,
      def: x.is_default,
      own: x.owner_id ? 1 : 0
    }));

    D.M = g(3).map(x => ({
      id: x.id,
      fo: x.folder_id,
      title: x.title,
      desc: x.description || '',
      type: x.file_type || '',
      path: x.file_path || '',
      pub: x.published,
      own: x.owner_id ? 1 : 0
    }));

    const F = g(4), paths = F.filter(x => x.image_path).map(x => x.image_path), su = {};
    if (paths.length) {
      const s = await sb.storage.from('flashcard-images').createSignedUrls(paths, 3600);
      (s.data || []).forEach(x => su[x.path] = x.signedUrl);
    }
    D.F = F.map(x => ({
      id: x.id, c: x.component, f: x.front, b: x.back || '', img: su[x.image_path] || '', ip: x.image_path || '', pub: x.published, own: x.owner_id ? 1 : 0
    }));

    P.fc = {}; 
    g(5).forEach(x => P.fc[x.flashcard_id] = x.status);
    
    P.bm = g(6).map(x => x.material_id);
    
    P.q = {}; 
    g(7).forEach(x => P.q[x.question_id] = [x.correct_count, x.total_count, +x.last_correct]);

    const at = g(8), an = at.length ? (await pg('quiz_answers', q => q.in('attempt_id', at.map(x => x.id)).order('id'))).data : [];
    P.h = at.map(a => ({
      id: a.id,
      ts: new Date(a.created_at).getTime(),
      sc: a.scope || '',
      n: a.total,
      k: a.correct,
      secs: a.seconds || 0,
      it: an.filter(x => x.attempt_id == a.id).sort((x, y) => x.position - y.position).map(x => ({ id: x.question_id, ch: x.chosen, ok: +x.is_correct }))
    }));

    D.U = [];
    if (role == 'admin') {
      const u = await sb.from('profiles').select('*').order('created_at');
      D.U = u.data || [];
    }
  } catch (err) {
    console.error('Fatal load exception:', err);
    toast('Database connection error. Check console (F12).');
  }
}

<div><p class="lb">1 · Choose what to include</p>${(c?[c]:C).map(k=>subs(k).length?`<p style="margin-top:8px"><b>${k}</b> <a class="lk sm" data-p="${k}" onclick="selK(this,1)">select all</a> · <a class="lk sm" data-p="${k}" onclick="selK(this,0)">clear</a></p>`+subs(k).map(s=>`<p class="sm" style="margin-top:6px"><b>${E(s)}</b> <a class="lk" data-p="${E(k+'|'+s)}" onclick="selK(this,1)">all</a> · <a class="lk" data-p="${E(k+'|'+s)}" onclick="selK(this,0)">none</a></p><div class="chips">${tops(k,s).map(t=>`<label class="chip"><input type="checkbox" data-k="${E(k+'|'+s+'|'+t)}" ${QS.sel.has(k+'|'+s+'|'+t)?'checked':''} onchange="tog(this)">${E(t)}</label>`).join('')}</div>`).join(''):'').join('')}</div>
<div><p class="lb">2 · Number of questions (minimum 10)</p><input type="number" min="10" value="${QS.n}" onchange="QS.n=+this.value;smry()"></div>
<div><p class="lb">3 · Timer in minutes (0 = no timer)</p><input type="number" min="0" value="${QS.t}" onchange="QS.t=+this.value;smry()"></div>
<p class="mu sm">Question order and answer choices are always shuffled. You submit once, at the end.</p>
<div class="exp" id="sum"></div><button class="btn p" onclick="startQ()">Start quiz</button></div>`}
function startQ(){const p=pool();if(p.length<10)return toast('At least 10 questions are needed. Select more topics.');const n=Math.min(Math.max(10,QS.n|0),p.length),
all=keys(QS.c).every(k=>QS.sel.has(k)),qs=sh(p).slice(0,n).map(x=>{const o=sh(x.o.map((t,i)=>[t,i]));return{...x,o:o.map(a=>a[0]),a:o.findIndex(a=>a[1]==x.a)}});
QZ={qs,sel:{},t0:Date.now(),end:QS.t>0?Date.now()+QS.t*60000:0,scope:(QS.c||'All components')+' · '+(all?'all subjects':QS.sel.size+' topics'),done:0};route();scrollTo(0,0)}
function tick(){const e=$('#tm');if(!QZ||QZ.done||!e)return;const s=Math.max(0,Math.round((QZ.end-Date.now())/1000));e.textContent='⏱ '+mmss(s);e.classList.toggle('low',s<60);if(!s)return submitQ(1);tk=setTimeout(tick,500)}
function cnt(){const e=$('#ans');if(e&&QZ)e.textContent=Object.keys(QZ.sel).length+' / '+QZ.qs.length+' answered'}
function submitQ(auto){const z=QZ,un=z.qs.length-Object.keys(z.sel).length;if(!auto&&un&&!confirm(un+' unanswered. Submit anyway?'))return;z.done=1;let sc=0;
const it=z.qs.map((q,i)=>{const ok=+(z.sel[i]===q.a);sc+=ok;const s=P.q[q.id]||[0,0,0];P.q[q.id]=[s[0]+ok,s[1]+1,ok];return{id:q.id,ch:z.sel[i]==null?null:q.o[z.sel[i]],ok}});
z.sc=sc;z.it=it;z.secs=Math.round((Date.now()-z.t0)/1000);P.h.unshift({id:U(),ts:Date.now(),sc:z.scope,n:z.qs.length,k:sc,secs:z.secs,it});route();scrollTo(0,0);
sb.from('quiz_attempts').insert({user_id:ME.id,scope:z.scope,total:z.qs.length,correct:sc,seconds:z.secs}).select().single().then(async r=>{if(r.error)return toast('Could not save history: '+r.error.message);P.h[0].id=r.data.id;const a=await sb.from('quiz_answers').insert(it.map((i,n)=>({attempt_id:r.data.id,user_id:ME.id,question_id:i.id,chosen:i.ch,is_correct:!!i.ok,position:n})));if(a.error)toast('Could not save answers: '+a.error.message)})}
const run=()=>`<div class="qbar"><b id="tm">${QZ.end?'⏱':'No timer'}</b><span id="ans" class="mu sm"></span><span><a class="lk sm" onclick="if(confirm('Quit this quiz? Your answers will be lost.')){QZ=null;route()}">Quit</a> <button class="btn p" onclick="submitQ()">Submit quiz</button></span></div><div class="stack">`+QZ.qs.map((q,i)=>`<div class="card"><p class="mu sm">Q${i+1} · ${E(q.s)} › ${E(q.t)}</p><p class="qt">${E(q.q)}</p>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" ${QZ.sel[i]===j?'checked':''} onchange="QZ.sel[${i}]=${j};cnt()">${E(o)}</label>`).join('')}</div>`).join('')+`<button class="btn p" onclick="submitQ()">Submit quiz</button></div>`;
const res=()=>{const z=QZ;return `<div class="card art stack"><h3>Score: ${z.sc} / ${z.qs.length} (${Math.round(100*z.sc/z.qs.length)}%)</h3><p class="mu">Time: ${mmss(z.secs)} · ${E(z.scope)}</p><div class="strip">${z.it.map(i=>`<i class="${i.ok?'g':''}"></i>`).join('')}</div><div class="row"><button class="btn p" onclick="QZ=null;route()">New quiz</button><button class="btn" onclick="go('hist')">History</button></div></div><div class="stack" style="margin-top:16px">`+z.qs.map((q,i)=>`<div class="card"><p class="mu sm">Q${i+1} · ${z.sel[i]==null?'— Not answered':z.it[i].ok?'✓ Correct':'✗ Wrong'} · ${E(q.s)} › ${E(q.t)}</p><p class="qt">${E(q.q)}</p>${q.o.map((o,j)=>`<div class="opt ${j==q.a?'ok':j==z.sel[i]?'no':''}">${E(o)}</div>`).join('')}<div class="exp">${E(q.e)}</div></div>`).join('')+'</div>'};
V.quiz=a=>{const c=C.includes(a)?a:'';return hd(c?c+' Quiz':'Quiz',c?'Questions from '+c+' only.':'Questions from every component.')+`<div class="w sec">${QZ?(QZ.done?res():run()):!QL?empty('Loading questions…'):allQ().length?setup(c):`<div class="card art stack"><h3>No questions yet</h3><p class="mu">An admin can add questions under Admin → Questions.</p></div>`}</div>`};

/* ===== HISTORY ===== */
let HV=null,HI=0,HW=0;
const flip=(f,b)=>`<div class="fc" onclick="this.classList.toggle('on')"><div class="fi"><div class="ff">${f}</div><div class="fb">${b}</div></div></div>`;
function replay(h){const l=h.it.map(i=>({i,q:allQ().find(x=>x.id==i.id)})).filter(x=>x.q&&(!HW||!x.i.ok)),
bk=`<div class="row" style="margin:0 0 12px"><button class="btn" onclick="HV=null;route()">← History</button><label class="sm"><input type="checkbox" ${HW?'checked':''} onchange="HW=this.checked?1:0;HI=0;route()"> Wrong answers only</label></div>`;
if(!l.length)return bk+empty('Nothing to show.');HI=Math.min(HI,l.length-1);const{i,q}=l[HI],n=l.length;
return bk+flip(`<div>${E(q.q)}<div class="sm mu" style="margin-top:10px">${q.o.map((o,j)=>'ABCD'[j]+'. '+E(o)).join('<br>')}</div></div>`,`<div><b>${i.ok?'✓ You were correct':'✗ You were wrong'}</b><p>Your answer: ${i.ch==null?'(none)':E(i.ch)}</p><p>Correct: ${E(q.o[q.a])}</p><p class="sm mu">${E(q.e)}</p></div>`)+`<p class="mu sm" style="text-align:center">Question ${HI+1} of ${n} · click the card to flip</p><div class="row" style="justify-content:center"><button class="btn" onclick="HI=(HI+${n-1})%${n};route()">←</button><button class="btn" onclick="HI=(HI+1)%${n};route()">→</button></div>`}
V.hist=()=>{const h=P.h.find(x=>x.id==HV),dt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),tm=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
return hd('Quiz History','Every quiz you finish is saved here. Green = correct, red = wrong.')+`<div class="w sec">${h?replay(h):`<div class="stack">${P.h.map(x=>`<div class="card"><div class="hrow"><div class="hl"><b>${dt(x.ts)}</b><span class="mu sm">${tm(x.ts)}</span><span class="mu sm">⏱ ${mmss(x.secs)} taken</span></div><div class="hr"><span class="hscore">${x.k} / ${x.n} <small class="mu">${Math.round(100*x.k/x.n)}%</small></span><button class="btn p" onclick="HV='${x.id}';HI=0;HW=0;route()">Review as flashcards</button><span class="tag">${E(x.sc)}</span></div></div><div class="strip">${x.it.map(i=>`<i class="${i.ok?'g':''}"></i>`).join('')}</div></div>`).join('')||empty('No quizzes taken yet.')}</div>`}</div>`};

/* ===== FLASHCARDS: generated from the question bank, plus official, formula and personal cards ===== */
let FT='s',FC={i:0,o:null},ED=null,FF={c:'',k:'q',s:'',t:'',m:''};
const qcard=x=>({id:x.id,c:x.c,own:x.own,src:'Question bank',fh:`<div>${E(x.q)}<div class="sm mu" style="margin-top:10px">${x.o.map((o,j)=>'ABCD'[j]+'. '+E(o)).join('<br>')}</div></div>`,bh:`<div><b>${'ABCD'[x.a]}. ${E(x.o[x.a])}</b>${x.e?`<p class="sm mu" style="margin-top:10px">${E(x.e)}</p>`:''}</div>`});
const fcard=x=>({id:x.id,c:x.c,own:x.own,src:x.own?'Personal':'Official',fh:`<div>${E(x.f)}</div>`,bh:`<div>${x.b?E(x.b):''}${x.img?`<img src="${x.img}" alt="">`:''}</div>`});
const deck=()=>{const k=FF.k||'q',m=FF.m;let d=k=='q'?allQ().filter(x=>(!FF.c||x.c==FF.c)&&(!FF.s||x.s==FF.s)&&(!FF.t||x.t==FF.t)).map(qcard)
:D.F.filter(x=>(x.pub||x.own)&&(!FF.c||x.c==FF.c)&&(k=='img'?x.img:k=='own'?x.own:!x.own)).map(fcard);
if(m)d=d.filter(x=>m=='new'?!P.fc[x.id]:P.fc[x.id]==m);return FC.o?d.sort((a,b)=>FC.o.indexOf(a.id)-FC.o.indexOf(b.id)):d};
function nav2(n){const l=deck().length;if(!l)return route();FC.i=(FC.i+n+l)%l;route()}
function mark(id,s){P.fc[id]=s;sb.from('flashcard_marks').upsert({user_id:ME.id,flashcard_id:id,status:s}).then(r=>r.error&&toast(r.error.message));nav2(1)}
function study(){const d=deck(),k=FF.k||'q',rs="FC.i=0;route()",
bar=`<div class="bar">${dd('ffK',[['q','From the question bank'],['off','Official cards'],['img','Formula cards (images)'],['own','My cards']],k,"FF.k=v;"+rs)}${dd('ffC',[['','All components'],...C],FF.c,"FF.c=v;FF.s='';FF.t='';"+rs)}${k=='q'&&FF.c?dd('ffS',[['','All subjects'],...subs(FF.c)],FF.s,"FF.s=v;FF.t='';"+rs):''}${k=='q'&&FF.s?dd('ffT',[['','All topics'],...tops(FF.c,FF.s)],FF.t,"FF.t=v;"+rs):''}${dd('ffM',[['','All cards'],['review','Need review'],['known','Known'],['new','Not marked yet']],FF.m,"FF.m=v;"+rs)}</div>`;
if(!d.length)return bar+empty(k=='q'?'No questions match this selection.':'No cards here yet. Add your own under My Cards.');
FC.i=Math.min(FC.i,d.length-1);const c=d[FC.i],s=P.fc[c.id];
return bar+flip(c.fh,c.bh)+`<p class="mu sm" style="text-align:center">Card ${FC.i+1} of ${d.length} · ${c.c} · ${c.src} · ${s=='known'?'Known':s=='review'?'Need review':'Not marked'} · click the card to flip</p><div class="row" style="justify-content:center"><button class="btn" onclick="nav2(-1)">←</button><button class="btn" onclick="mark('${c.id}','review')">Need Review</button><button class="btn p" onclick="mark('${c.id}','known')">Known</button><button class="btn" onclick="nav2(1)">→</button><button class="btn" onclick="FC.o=sh(deck().map(x=>x.id));FC.i=0;route()">Shuffle</button></div>`}
function readImg(id,cb){const f=$('#'+id).files[0];if(!f)return cb();const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);c.toBlob(cb,'image/jpeg',.8)};i.onerror=()=>toast('Could not read that image');i.src=r.result};r.readAsDataURL(f)}
function saveF(own){const f=v('ff').trim(),b=v('fb').trim();if(!f)return toast('Add a title for the front');
readImg('fi',async blob=>{const e=own&&D.F.find(x=>x.id==ED);if(!b&&!blob&&!(e&&e.img))return toast('Add back text or an image');
const oid=own?ME.id:null;let ip=e?e.ip:'';
if(blob){ip=(oid||'official')+'/'+crypto.randomUUID()+'.jpg';const u=await sb.storage.from('flashcard-images').upload(ip,blob,{contentType:'image/jpeg'});if(u.error)return toast(u.error.message)}
const row={component:v('fk'),front:f,back:b,image_path:ip||null};
const r=e?await sb.from('flashcards').update(row).eq('id',e.id).select().single():await sb.from('flashcards').insert({...row,owner_id:oid}).select().single();
if(r.error)return toast(r.error.message);
let img=e?e.img:'';if(blob){const s=await sb.storage.from('flashcard-images').createSignedUrl(ip,3600);img=s.data?s.data.signedUrl:''}
const x={id:r.data.id,c:row.component,f,b,img,ip:ip||'',pub:r.data.published,own:own?1:0};if(e)Object.assign(e,x);else D.F.push(x);ED=null;route()})}
const fform=(e,own)=>`${dd('fk',C,e.c||C[0])}<input id="ff" placeholder="Front / title" value="${E(e.f||'')}" style="width:100%"><textarea id="fb" placeholder="Back / answer (optional if you add an image)">${E(e.b||'')}</textarea><div><p class="lb">Formula image (optional)</p><input type="file" id="fi" accept="image/*">${e.img?'<p class="mu sm">Current image is kept unless you choose a new one.</p>':''}</div><div class="row"><button class="btn p" onclick="saveF(${own})">Save</button>${ED&&own?'<button class="btn" onclick="ED=null;route()">Cancel</button>':''}</div>`;
function mine(){const e=D.F.find(x=>x.id==ED)||{};return `<div class="card stack"><h3>${ED?'Edit card':'New card'} <span class="mu sm">(private to you)</span></h3>${fform(e,1)}</div><div class="g" style="margin-top:16px">${D.F.filter(x=>x.own).map(x=>`<div class="card"><b>${E(x.f)}</b> ${x.img?'<span class="tag">image</span>':''}<p class="mu sm">${x.c}</p><div class="row"><button class="btn" onclick="ED='${x.id}';route()">Edit</button><button class="btn" onclick="del('F','${x.id}')">Delete</button></div></div>`).join('')||empty('You have no personal cards yet.')}</div>`}
V.cards=()=>hd('Flashcards','Study cards made from the question bank, plus official, formula and your own cards.')+`<div class="w sec"><div class="tabs">${[['s','Study'],['m','My Cards']].map(([k,n])=>`<a class="${FT==k?'on':''}" onclick="FT='${k}';route()">${n}</a>`).join('')}</div>${FT=='s'?study():mine()}</div>`;

/* ===== MY QUESTIONS ===== */
async function addQ(off){const o=[0,1,2,3].map(i=>v('o'+i).trim()),q=v('mq').trim(),s=v('ms').trim(),t=v('mt').trim();if(!q||!s||!t||o.some(x=>!x))return toast('Fill in subject, topic, question and all 4 choices');
const r=await sb.from('questions').insert({component:v('mc'),subject:s,topic:t,question:q,choice_a:o[0],choice_b:o[1],choice_c:o[2],choice_d:o[3],correct_answer:'ABCD'[+v('ma')],explanation:v('me').trim(),owner_id:off?null:ME.id}).select().single();
if(r.error)return toast(r.error.message);const x=dbq(r.data);off?OQ.push(x):D.MQ.push(x);toast('Question added');route()}
const qform=off=>`<div class="card stack">${dd('mc',C,C[0])}<div class="row"><input id="ms" placeholder="Subject" list="sl"><input id="mt" placeholder="Topic"></div><datalist id="sl">${[...new Set(allQ().map(x=>x.s))].map(s=>`<option value="${E(s)}">`).join('')}</datalist><textarea id="mq" placeholder="Question"></textarea>${[0,1,2,3].map(i=>`<input id="o${i}" placeholder="Choice ${'ABCD'[i]}" style="width:100%">`).join('')}<div class="row">${dd('ma',[0,1,2,3].map(i=>[i,'Correct: '+'ABCD'[i]]),0)}</div><textarea id="me" placeholder="Explanation / solution"></textarea><button class="btn p" onclick="addQ(${off})">Add question</button></div>`;
V.myq=()=>hd('My Questions','Add your own questions. They are private and appear in your quizzes.')+`<div class="w sec stack">${qform(0)}${D.MQ.map(x=>`<div class="card"><p class="mu sm">${x.c} › ${E(x.s)} › ${E(x.t)}</p><p>${E(x.q)}</p><a class="lk" onclick="del('MQ','${x.id}')">Delete</a></div>`).join('')}</div>`;

/* ===== ADMIN ===== */
let AT='o';
async function pub(id){const x=D.F.find(x=>x.id==id),r=await sb.from('flashcards').update({published:!x.pub}).eq('id',id);if(r.error)return toast(r.error.message);x.pub=!x.pub;route()}
async function impCsv(el){const f=el.files[0];if(!f)return;const rows=[];
csv((await f.text()).replace(/^\uFEFF/,'')).slice(1).filter(r=>r.length>=14).forEach(r=>{const x=r.length-14,g=i=>(r[i<9?i:i+x]||'').trim(),a=g(9).toUpperCase();/* rows with 2 extra columns are auto-repaired */
if(a.length!=1||!'ABCD'.includes(a))return;rows.push({question_number:+g(0)||null,component:g(1).toUpperCase(),subject:g(2),topic:g(3),question:g(4),choice_a:g(5),choice_b:g(6),choice_c:g(7),choice_d:g(8),correct_answer:a,explanation:g(10),difficulty:g(11),source:g(12),verification_status:g(13),owner_id:null})});
if(!rows.length)return toast('No valid rows found. Check the columns.');if(!confirm('Add '+rows.length+' official questions?'))return;
for(let i=0;i<rows.length;i+=100){const r=await sb.from('questions').insert(rows.slice(i,i+100));if(r.error)return toast(r.error.message)}
toast('Added '+rows.length+' questions');await load();route()}
const AD={
o:()=>`<div class="g">${[['Users',D.U.length],['Official questions',OQ.length],['Folders',D.FO.length],['Folder items',D.M.length],['Official flashcards',D.F.filter(x=>!x.own).length]].map(([n,x])=>`<div class="card art stat"><b>${x}</b><span class="mu sm">${n}</span></div>`).join('')}</div>`,
u:()=>`<table><tr><th>Name</th><th>Role</th><th>Joined</th></tr>${D.U.map(u=>`<tr><td>${E(u.display_name||'')}</td><td>${u.role}</td><td class="mu sm">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</table><p class="mu sm">To change someone's role, edit the profiles table in Supabase (Table Editor).</p>`,
f:()=>`<div class="card stack"><h3>New official card</h3>${fform({},0)}</div><table>${D.F.filter(x=>!x.own).map(x=>`<tr><td>${E(x.f)} ${x.img?'🖼':''}</td><td class="mu sm">${x.c}</td><td><a class="lk" onclick="pub('${x.id}')">${x.pub?'Published':'Hidden'}</a></td><td><a class="lk" onclick="del('F','${x.id}')">Delete</a></td></tr>`).join('')}</table>`,
q:()=>{const m={};OQ.forEach(x=>{const k=x.c+' › '+x.s+' › '+x.t;m[k]=(m[k]||0)+1});const fl=OQ.filter(x=>/need/i.test(x.st)).length;
return `<div class="card stack"><h3>Official questions: ${OQ.length}</h3><p class="mu sm">Add one below, or import a CSV with the same columns as before. New questions show up for everyone right away.</p><div><p class="lb">Import CSV</p><input type="file" accept=".csv" onchange="impCsv(this)"></div>${fl?`<p class="sm">${fl} question(s) are marked "Needs Review".</p>`:''}</div><h3 style="margin-top:18px">Add one official question</h3>${qform(1)}<table>${Object.entries(m).map(([k,n])=>`<tr><td>${E(k)}</td><td>${n}</td></tr>`).join('')}</table>`}};
V.admin=()=>hd('Admin Dashboard','Manage official content. Security is enforced by the database rules (RLS).')+`<div class="w sec"><div class="tabs">${[['o','Overview'],['u','Users'],['f','Official cards'],['q','Questions']].map(([k,n])=>`<a class="${AT==k?'on':''}" onclick="AT='${k}';route()">${n}</a>`).join('')}</div>${AD[AT]()}</div>`;

V.auth=()=>{const m=AU.mode,T={in:'Log in',up:'Create account',reset:'Reset password',newpw:'Set a new password'};
return hd(T[m],m=='newpw'?'Choose a new password for your account.':'Sign in to save your progress and keep it on every device.')+`<div class="w sec"><div class="card art stack" style="max-width:440px;margin:auto">${AU.msg?`<div class="exp">${E(AU.msg)}</div>`:''}${m=='up'?'<input id="an" placeholder="Display name" style="width:100%">':''}${m=='newpw'?'':'<input id="ae" type="email" placeholder="Email" autocomplete="email" style="width:100%">'}${m=='reset'?'':`<input id="ap" type="password" placeholder="${m=='newpw'?'New password':'Password'}" autocomplete="${m=='in'?'current-password':'new-password'}" style="width:100%">`}<button class="btn p" onclick="doAuth()">${T[m]}</button><p class="sm">${m=='in'?`<a class="lk" onclick="AU.mode='up';AU.msg='';route()">Create an account</a> · <a class="lk" onclick="AU.mode='reset';AU.msg='';route()">Forgot password?</a>`:m=='newpw'?'':`<a class="lk" onclick="AU.mode='in';AU.msg='';route()">Back to log in</a>`}</p></div></div>`};
async function doAuth(){const m=AU.mode,e=m=='newpw'?'':v('ae').trim(),p=m=='reset'?'':v('ap');let r;
if(m=='up'){if(p.length<6)return toast('Password needs at least 6 characters');r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:v('an').trim()||e.split('@')[0]}}})}
else if(m=='in')r=await sb.auth.signInWithPassword({email:e,password:p});
else if(m=='reset'){r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(!r.error){AU.msg='Check your email for the reset link.';return route()}}
else{r=await sb.auth.updateUser({password:p});if(!r.error){AU.mode='in';toast('Password updated');return go('dash')}}
if(r.error)return toast(r.error.message);
if(m=='up'&&!r.data.session){AU.msg='Account created. Check your email to confirm it, then log in.';route()}}
  
function route(){clearTimeout(tk);const[n0,a]=(location.hash.slice(2)||'home').split('/');let n=V[n0]?n0:'home';
if(!QL){$('#app').innerHTML='<div class="w sec">'+empty('Loading…')+'</div>';$('#tb').innerHTML='';$('#bg').style.display='none';return}
if(!ME&&!['home','auth'].includes(n))n='auth';
if(ME&&n=='auth'&&AU.mode!='newpw')n='dash';
if(n=='admin'&&role!='admin'){toast('Admins only');n='dash'}
const ap=$('#app');ap.innerHTML=V[n](a);if(nv){ap.className='';void ap.offsetWidth;ap.className='in';nv=0}
$('#tb').innerHTML=tbar();$('#dr').innerHTML=ME?drawer():'';$('#bg').style.display=ME?'':'none';
renderFab();
renderCustomConfirm();
renderFileViewer();
if(n=='quiz'&&QZ&&!QZ.done){cnt();if(QZ.end)tick()}else smry()}
addEventListener('hashchange',()=>{nv=1;scrollTo(0,0);route()});
addEventListener('keydown',e=>{if(e.key=='Enter'&&location.hash=='#/auth'&&e.target.tagName=='INPUT')doAuth()});
/* session: runs on page load, login, logout and password-reset links */
sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
if(ev=='PASSWORD_RECOVERY')AU.mode='newpw';
ME=s&&s.user||null;
if(!ME){CU=null;D={FO:[],M:[],F:[],MQ:[],U:[]};P={h:[],q:{},fc:{},bm:[]};OQ=[];PR=null;role='student';QZ=null;QL=1;if(ev=='SIGNED_OUT')go('home');else route();return}
if(ME.id!=CU){CU=ME.id;QL=0;route();await load();QL=1}
if(AU.mode=='newpw')go('auth');else if(location.hash=='#/auth')go('dash');else route()},0));
route();
</script>
</body>
</html>
